<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 44" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gold-line-left" x1="40" y1="22" x2="330" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7A54A" stop-opacity="0" />
      <stop offset="35%" stop-color="#C7A54A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C7A54A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="gold-line-right" x1="430" y1="22" x2="720" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7A54A" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#C7A54A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C7A54A" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C7A54A" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#C7A54A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C7A54A" stop-opacity="0" />
    </radialGradient>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#soft-glow)">
    <path d="M40 22 H292" stroke="url(#gold-line-left)" stroke-width="1.4" stroke-linecap="round" />
    <path d="M468 22 H720" stroke="url(#gold-line-right)" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <g transform="translate(380 22)">
    <circle r="11" fill="url(#center-glow)" opacity="0.32" />
    <circle r="8.2" fill="none" stroke="#C7A54A" stroke-opacity="0.85" stroke-width="1.15" />
    <circle r="3.1" fill="#C7A54A" />
    <path d="M0 -15 L2.8 -2.8 L15 0 L2.8 2.8 L0 15 L-2.8 2.8 L-15 0 L-2.8 -2.8 Z" fill="#C7A54A" fill-opacity="0.9" />
    <path d="M0 -7.2 L1.8 0 L0 7.2 L-1.8 0 Z" fill="#0D0D0D" fill-opacity="0.9" />
  </g>

  <g fill="#C7A54A" fill-opacity="0.65">
    <circle cx="334" cy="22" r="1.7" />
    <circle cx="426" cy="22" r="1.7" />
    <circle cx="355" cy="15" r="0.9" />
    <circle cx="405" cy="29" r="0.9" />
  </g>
</svg>
