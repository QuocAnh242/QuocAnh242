name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: QuocAnh242
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#A6822B&color_dots=#f0f0f0,#e1d8c1,#d4c194,#c7a54a,#8f7331
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#C7A54A&color_dots=#141414,#222222,#444444,#777777,#A6822B

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
